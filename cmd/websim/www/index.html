<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MagKal Web Simulator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" type="text/css" href="css/materialize.css" media="screen,projection">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/analysis.css">
</head>
<body>
<main id="app">
    <header>
        <nav>
            <div class="nav-wrapper">
                <span class="connected" v-if="connected">Connected</span>
                <span class="disconnected" v-else>Disconnected</span>
                <a href="/" class="brand-logo right">MagKal Web Simulator</a>
            </div>
        </nav>
    </header>

    <div class="row">
        <div class="col s6">
            <div class="row">
                <div class="input-field col s4">
                    <select v-model.number="source">
                        <option value="0">Manual</option>
                        <option value="1">Random</option>
                        <option value="3">Actual</option>
                        <option value="4">Scenario</option>
                    </select>
                    <label>Magnetometer Data Source</label>
                </div>
                <div class="input-field col s4" v-if="source==0 || source==1">
                    <input type="number" v-model.number="n" @change="check_n()">
                    <label>Number of Dimensions</label>
                </div>
                <div class="input-field col s4" v-if="source!=4">
                    <input type="number" v-model.number="n0" @change="check_n0()">
                    <label>Magnetic Field Strength</label>
                </div>
            </div>

            <!-- Scenario panel: only when scenario source is selected. -->
            <div v-if="source==4">
                <div class="row">
                    <div class="input-field col s8">
                        <select v-model="scenarioPick">
                            <option v-for="name in scenarios" :value="name">{{ name }}</option>
                        </select>
                        <label>Scenario</label>
                    </div>
                    <div class="input-field col s4">
                        <button class="btn waves-effect" @click="loadScenario()" :disabled="!scenarioPick">Load</button>
                    </div>
                </div>
                <div class="row" v-if="playback.loaded">
                    <div class="col s12 scenario-controls">
                        <button class="btn-flat" @click="playPause()">
                            <i class="material-icons">{{ playback.playing ? 'pause' : 'play_arrow' }}</i>
                        </button>
                        <button class="btn-flat" @click="stepOne()" :disabled="playback.playing">
                            <i class="material-icons">skip_next</i>
                        </button>
                        <button class="btn-flat" @click="resetScenario()">
                            <i class="material-icons">replay</i>
                        </button>
                        <select v-model.number="rateHz" @change="setRate()" style="display:inline-block; width:auto;">
                            <option value="1">1 Hz</option>
                            <option value="10">10 Hz</option>
                            <option value="30">30 Hz</option>
                            <option value="100">100 Hz</option>
                        </select>
                        <span class="seg-label">{{ playback.segment }}</span>
                        <span class="step-counter">{{ playback.step }} / {{ playback.total }}</span>
                        <span v-if="playback.seeking" class="seeking-indicator">seeking…</span>
                    </div>
                </div>
                <div class="row" v-if="playback.total > 0">
                    <div class="input-field col s12">
                        <input type="range" min="0" :max="playback.total" :value="playback.step" @input="onScrub($event)">
                    </div>
                </div>
            </div>

            <!-- Truth (k, l) inputs for manual/random sources -->
            <div class="row" v-if="source==0 || source==1">
                <div class="col s4">
                    <div class="input-field col s12">
                        <input type="number" v-model.number="kAct0" @change="check_kAct()">
                        <label>Actual k0</label>
                    </div>
                    <div class="input-field col s12">
                        <input type="number" v-model.number="lAct0" @change="check_lAct()">
                        <label>Actual l0</label>
                    </div>
                </div>
                <div class="col s4" v-if="n>=2">
                    <div class="input-field col s12">
                        <input type="number" v-model.number="kAct1" @change="check_kAct()">
                        <label>Actual k1</label>
                    </div>
                    <div class="input-field col s12">
                        <input type="number" v-model.number="lAct1" @change="check_lAct()">
                        <label>Actual l1</label>
                    </div>
                </div>
                <div class="col s4" v-if="n==3">
                    <div class="input-field col s12">
                        <input type="number" v-model.number="kAct2" @change="check_kAct()">
                        <label>Actual k2</label>
                    </div>
                    <div class="input-field col s12">
                        <input type="number" v-model.number="lAct2" @change="check_lAct()">
                        <label>Actual l2</label>
                    </div>
                </div>
            </div>

            <!-- Filter tuning (always visible) -->
            <div class="row" v-if="source!=4">
                <div class="input-field col s3">
                    <input type="number" v-model.number="sigmaK0" @change="check_sigmaK0()">
                    <label>k Noise (Initial)</label>
                </div>
                <div class="input-field col s3">
                    <input type="number" v-model.number="sigmaK" @change="check_sigmaK()">
                    <label>k Noise (Process)</label>
                </div>
                <div class="input-field col s3">
                    <input type="number" v-model.number="sigmaM" @change="check_sigmaM()">
                    <label>Magnetometer noise scale</label>
                </div>
            </div>

            <!-- Convergence thresholds + state machine config -->
            <div class="row" v-if="source!=4">
                <div class="input-field col s3">
                    <input type="number" v-model.number="maxSigmaK">
                    <label>maxSigmaK</label>
                </div>
                <div class="input-field col s3">
                    <input type="number" v-model.number="maxSigmaL">
                    <label>maxSigmaL</label>
                </div>
                <div class="input-field col s6">
                    <label>
                        <input type="checkbox" v-model="smOn"/>
                        <span>Enable state machine</span>
                    </label>
                </div>
            </div>
            <div class="row" v-if="source!=4 && smOn">
                <div class="input-field col s4">
                    <input type="number" v-model.number="lockHysteresis">
                    <label>lockHysteresis</label>
                </div>
                <div class="input-field col s4">
                    <input type="number" v-model.number="nisWindow">
                    <label>nisWindow</label>
                </div>
                <div class="input-field col s4">
                    <input type="number" v-model.number="nisThreshold">
                    <label>nisThreshold</label>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="row" v-if="source!=4">
                <div class="input-field col s12">
                    <button class="btn col s3" @click="restart()">Restart</button>
                    <button class="btn col s3" @click="measureMany()" v-if="!check_params_changed() && (source==1 || source==3) && !measuring">Measure Many</button>
                    <button class="btn col s3" @click="measureOnce()" v-if="!check_params_changed() && (source==1 || source==3) && !measuring">Measure Once</button>
                    <button class="btn col s3" @click="pause()" v-if="!check_params_changed() && (source==1 || source==3) && measuring">Pause</button>
                </div>
            </div>
        </div>

        <div class="col s6">
            <!-- State machine status panel -->
            <div class="row">
                <div class="col s12 sm-panel">
                    <span class="sm-badge" :class="'mode-' + mode.toLowerCase()">{{ mode || '—' }}</span>
                    <span class="sm-metric"><label>NIS</label> {{ nis != null ? nis.toFixed(3) : '—' }}</span>
                    <span class="sm-metric"><label>Converged</label> {{ converged ? 'yes' : 'no' }}</span>
                    <button class="btn-flat" @click="forceUnlock()" :disabled="mode != 'LCK'">Force Unlock</button>
                    <button class="btn-flat" @click="forceLock()" :disabled="mode != 'CAL'">Force Lock</button>
                </div>
            </div>
            <div class="col s12">
                <div class="card horizontal">
                    <div id="messages" class="card-content" v-html="msgContent">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div id="m-plot" class="svg-container"></div>
    </div>
</main>

<footer class="page-footer">
</footer>
<script type="text/javascript" src="js/d3.js"></script>
<script type="text/javascript" src="js/materialize.js"></script>
<script type="text/javascript" src="js/vue.js"></script>
<script type="text/javascript" src="js/analysis.js"></script>
<script type="text/javascript" src="js/app.js"></script>
</body>
</html>
