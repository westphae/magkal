# Realistic mobile-device workflow:
#   1) "home_init"       – hand-rotate the device through random orientations
#                          for a couple hundred samples (initial calibration).
#   2) "cruise_steady"   – install on the glareshield and hold a single heading
#                          with small attitude jitter for a long time. We want
#                          to see whether a well-calibrated state survives a
#                          long degenerate observation window.
#
# Earth field: mid-northern-latitude geomagnetic, inclination ~65° down.
truth:
  n: 3
  n0: 50000.0
  k: [0.95, 0.92, 1.03]
  l: [120.0, -85.0, 240.0]
  noise: 50.0
  inclination_deg: 65.0

filter:
  sigmaK0: 0.25
  sigmaK:  1.0e-8
  sigmaM:  1.0e-3
  # Tunable convergence thresholds. Re-ground against real hardware once
  # we have MEMS-magnetometer noise data.
  maxSigmaK: 1.0e-3   # 0.1% on scale factor
  maxSigmaL: 5.0      # 5 nT, ~1e-4 of n0

seed: 42

steps:
  - random:
      count: 200
      label: "home_init"
  - body_frame:
      heading_deg: 0
      pitch_deg: 0
      roll_deg: 0
      jitter_heading_deg: 0.5
      jitter_pitch_deg: 1.0
      jitter_roll_deg: 1.0
      count: 1000000
      label: "cruise_steady"
