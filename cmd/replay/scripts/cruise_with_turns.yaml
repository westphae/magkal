# A more realistic flight profile: init by boxing the compass, then alternating
# 10k-step holds on N/E/S/W with brief sweeps in between (simulating turns
# between waypoints). Less brutal than cruise_long_hold but still mostly
# degenerate.
truth:
  n: 3
  n0: 50000.0
  k: [0.95, 0.92, 1.03]
  l: [120.0, -85.0, 240.0]
  noise: 50.0

filter:
  sigmaK0: 0.25
  sigmaK:  1.0e-8
  sigmaM:  1.0e-3

seed: 42

steps:
  - sweep:
      from: [0,   0]
      to:   [330, 0]
      step: [30,  0]
      label: "init_box"

  - hold:
      at: [0, 0]
      jitter_deg: 1.0
      count: 10000
      label: "cruise_N"
  - sweep:
      from: [0,  0]
      to:   [90, 0]
      step: [10, 0]
      label: "turn_to_E"

  - hold:
      at: [90, 0]
      jitter_deg: 1.0
      count: 10000
      label: "cruise_E"
  - sweep:
      from: [90,  0]
      to:   [180, 0]
      step: [10,  0]
      label: "turn_to_S"

  - hold:
      at: [180, 0]
      jitter_deg: 1.0
      count: 10000
      label: "cruise_S"
  - sweep:
      from: [180, 0]
      to:   [270, 0]
      step: [10,  0]
      label: "turn_to_W"

  - hold:
      at: [270, 0]
      jitter_deg: 1.0
      count: 10000
      label: "cruise_W"
