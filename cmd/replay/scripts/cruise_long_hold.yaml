# The convergence killer: a short box-the-compass init (so the filter has
# *some* geometric information to anchor on), followed by a long hold near
# one orientation that simulates an aircraft cruising straight and level.
# This is the regression scenario any filter change must survive.
truth:
  n: 3
  n0: 50000.0      # nT, roughly Earth field magnitude
  k: [0.95, 0.92, 1.03]
  l: [120.0, -85.0, 240.0]
  noise: 50.0      # nT

filter:
  sigmaK0: 0.25
  sigmaK:  1.0e-8
  sigmaM:  1.0e-3  # fraction of n0
  # With phi=0 throughout, the z-axis is never observed, so the z-axis
  # P-diagonals stay near their initial high values and Converged() must
  # return false regardless of how long the run is. This is the
  # regression test for the criterion correctly rejecting an
  # under-observed axis.
  maxSigmaK: 1.0e-3
  maxSigmaL: 5.0

seed: 42

steps:
  - sweep:
      from: [0,   0]
      to:   [330, 0]
      step: [30,  0]
      label: "init_box"
  # Cruise north, level, for 100k samples. Small attitude jitter to mimic
  # a real airframe but well below the geometric span needed for new info.
  - hold:
      at: [0, 0]
      jitter_deg: 1.0
      count: 100000
      label: "cruise_north"
